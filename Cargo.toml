[package]
name = "rustmux"
version = "0.1.0"
edition = "2024"
description = "A small tmux-like terminal multiplexer written in Rust"
license = "MIT"

[features]
fuzzing = []
benchmarks = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
nix = { version = "0.31", features = ["fs", "poll", "process", "signal", "term"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-segmentation = "1.13"
unicode-width = "0.2"
vt100 = "0.16.2"

[[bench]]
name = "image_preview"
harness = false
required-features = ["benchmarks"]
