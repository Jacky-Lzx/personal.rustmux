[book]
title = "Rustmux Documentation"
authors = ["Rustmux contributors"]
description = "A small, modern terminal multiplexer written in Rust"
language = "en"
src = "docs"

[build]
build-dir = "dist"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["docs/theme/rustmux.css"]
additional-js = ["docs/theme/rustmux.js"]
git-repository-url = "https://github.com/Jacky-Lzx/Rustmux"
edit-url-template = "https://github.com/Jacky-Lzx/Rustmux/edit/main/{path}"
site-url = "/"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
